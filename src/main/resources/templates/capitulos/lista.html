<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capitulos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: avisos}"></div><div class="d-flex justify-content-between"><h1>Capitulos</h1><a class="btn btn-success" th:href="@{/capitulos/nuevo}">Nuevo capitulo</a></div><div th:if="${#lists.isEmpty(capitulos)}" class="alert alert-info mt-3">No hay capitulos.</div><div class="table-responsive"><table th:unless="${#lists.isEmpty(capitulos)}" class="table table-striped mt-3"><thead><tr><th>Numero</th><th>Titulo</th><th>Libro</th><th>Acciones</th></tr></thead><tbody><tr th:each="c:${capitulos}"><td th:text="${c.numero}"></td><td th:text="${c.titulo}"></td><td th:text="${c.libro.titulo}"></td><td><a class="btn btn-sm btn-warning" th:href="@{/capitulos/{id}/editar(id=${c.id})}">Editar</a> <a class="btn btn-sm btn-danger" th:href="@{/capitulos/{id}/eliminar(id=${c.id})}">Eliminar</a></td></tr></tbody></table></div></main></body></html>
