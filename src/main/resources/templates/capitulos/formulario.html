<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario capitulo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <h1 th:text="${capitulo.id == null ? 'Nuevo capitulo' : 'Editar capitulo'}"></h1>
    <div th:replace="~{fragments :: avisos}"></div>

    <form th:action="@{/capitulos/guardar}" th:object="${capitulo}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Libro</label>
            <select class="form-select" th:field="*{libroId}">
                <option value="">Selecciona un libro</option>
                <option th:each="l : ${libros}"
                        th:value="${l.id}"
                        th:text="${l.titulo}"></option>
            </select>
            <div class="text-danger" th:errors="*{libroId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Numero</label>
            <input type="number" min="1" class="form-control" th:field="*{numero}">
            <div class="text-danger" th:errors="*{numero}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Titulo</label>
            <input type="text" class="form-control" th:field="*{titulo}">
            <div class="text-danger" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Resumen</label>
            <textarea class="form-control" rows="4" th:field="*{resumen}"></textarea>
            <div class="text-danger" th:errors="*{resumen}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/capitulos}">Cancelar</a>
    </form>
</main>
</body>
</html>
