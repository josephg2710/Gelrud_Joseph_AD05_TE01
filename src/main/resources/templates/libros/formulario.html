<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario libro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><h1 th:text="${libro.id==null?'Nuevo libro':'Editar libro'}"></h1><form th:action="@{/libros/guardar}" th:object="${libro}" method="post" novalidate><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Titulo</label><input class="form-control" th:field="*{titulo}"><div class="text-danger" th:errors="*{titulo}"></div></div><div class="mb-3"><label class="form-label">Autor</label><input class="form-control" th:field="*{autor}"><div class="text-danger" th:errors="*{autor}"></div></div><div class="mb-3"><label class="form-label">Genero</label><input class="form-control" th:field="*{genero}"><div class="text-danger" th:errors="*{genero}"></div></div><div class="mb-3"><label class="form-label">Descripcion</label><textarea class="form-control" rows="4" th:field="*{descripcion}"></textarea><div class="text-danger" th:errors="*{descripcion}"></div></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-secondary" th:href="@{/libros}">Cancelar</a></form></main></body></html>
