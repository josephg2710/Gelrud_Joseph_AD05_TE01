<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eliminar libro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="alert alert-warning"><h1>Confirmar borrado</h1><p>Se eliminara el libro <strong th:text="${libro.titulo}"></strong> y todos sus capitulos. Esta accion no se puede deshacer.</p></div><form th:action="@{/libros/{id}/eliminar(id=${libro.id})}" method="post"><button class="btn btn-danger">Confirmar eliminacion</button> <a class="btn btn-secondary" th:href="@{/libros}">Cancelar</a></form></main></body></html>
