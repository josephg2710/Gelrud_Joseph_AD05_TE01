<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Libros</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: avisos}"></div><div class="d-flex justify-content-between"><h1>Libros</h1><a class="btn btn-success" th:href="@{/libros/nuevo}">Nuevo libro</a></div><div th:if="${#lists.isEmpty(libros)}" class="alert alert-info mt-3">No hay libros.</div><div class="table-responsive"><table th:unless="${#lists.isEmpty(libros)}" class="table table-striped mt-3"><thead><tr><th>Titulo</th><th>Autor</th><th>Genero</th><th>Capitulos</th><th>Acciones</th></tr></thead><tbody><tr th:each="l:${libros}"><td th:text="${l.titulo}"></td><td th:text="${l.autor}"></td><td th:text="${l.genero}"></td><td th:text="${#lists.size(l.capitulos)}"></td><td><a class="btn btn-sm btn-warning" th:href="@{/libros/{id}/editar(id=${l.id})}">Editar</a> <a class="btn btn-sm btn-danger" th:href="@{/libros/{id}/eliminar(id=${l.id})}">Eliminar</a></td></tr></tbody></table></div></main></body></html>
